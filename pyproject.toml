[project]
name = "rws-course"
version = "0.1.0"
description = "Interactive platform for statistical and probabilistic analysis in geotechnical engineering"
requires-python = ">=3.11"
dependencies = [
    "dash>=3.2.0",
    "flask>=3.1.2",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "plotly>=6.3.0",
    "scipy>=1.16.2",
    "tqdm>=4.67.1",
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "src", "main"]

[dependency-groups]
dev = []
